name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
    # web/ 빌드가 ?raw로 api/*.sql·shared/*를 그대로 가져다 쓰므로(단일 소스 유지),
    # 그 경로들이 바뀌어도 재배포되어야 한다.
    paths: ["web/**", "api/**", "shared/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
